<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
	<meta name="description" content="بایگانی دیجیتال نشریات و روزنامه‌های تاریخی ایران">
	<title>بایگانی نشریات ایران</title>
	<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

:root {
  --body-bg: #f4f1ea;
  --text-color: #1c1917;
  --text-secondary: #57534e;
  --control-bg: #fffcf7;
  --border-color: #e7e0d4;
  --border-subtle: #f0ebe3;
  --button-bg: #0d9488;
  --button-hover-bg: #0f766e;
  --button-disabled-bg: #d6d3d1;
  --error-color: #dc2626;
  --status-color: #2563eb;
  --section-bg: #fffcf7;
  --section-title-color: #292524;
  --lightbox-bg: #fffcf7;
  --lightbox-text-color: #1c1917;
  --lightbox-button-bg: #1d4ed8;
  --lightbox-button-hover-bg: #1e40af;
  --lightbox-close-button-color: #57534e;
  --highlight-color-r: 13;
  --highlight-color-g: 148;
  --highlight-color-b: 136;
  --highlight-color: rgb(var(--highlight-color-r), var(--highlight-color-g), var(--highlight-color-b));
  --highlight-text-color: #ffffff;
  --multiple-issues-color: #d97706;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.05);
  --shadow-md: 0 4px 14px rgba(28, 25, 23, 0.07), 0 1px 3px rgba(28, 25, 23, 0.04);
  --shadow-lg: 0 12px 28px rgba(28, 25, 23, 0.1), 0 4px 10px rgba(28, 25, 23, 0.05);
  --shadow-xl: 0 24px 48px rgba(28, 25, 23, 0.14);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (prefers-color-scheme: dark) {
:root {
  --body-bg: #12141a;
  --text-color: #f5f5f4;
  --text-secondary: #a8a29e;
  --control-bg: #1c1f28;
  --border-color: #2e3340;
  --border-subtle: #252933;
  --button-bg: #0f766e;
  --button-hover-bg: #14b8a6;
  --button-disabled-bg: #3f4654;
  --error-color: #f87171;
  --status-color: #60a5fa;
  --section-bg: #1c1f28;
  --section-title-color: #e7e5e4;
  --lightbox-bg: #1e2230;
  --lightbox-text-color: #f5f5f4;
  --lightbox-button-bg: #1d4ed8;
  --lightbox-button-hover-bg: #3b82f6;
  --lightbox-close-button-color: #a8a29e;
  --highlight-color-r: 20;
  --highlight-color-g: 160;
  --highlight-color-b: 145;
  --highlight-color: rgb(var(--highlight-color-r), var(--highlight-color-g), var(--highlight-color-b));
  --highlight-text-color: #f5f5f4;
  --multiple-issues-color: #d97706;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.18);
  --shadow-lg: 0 12px 28px rgba(0,0,0,0.35), 0 4px 10px rgba(0,0,0,0.22);
  --shadow-xl: 0 24px 48px rgba(0,0,0,0.45);
}

.newspaper-logo,
	.lightbox-logo {
  filter: invert(1) brightness(1.2);
}

.newspaper-logo[src*="dark"],
	.lightbox-logo[src*="dark"] {
  filter: none;
}

.newspaper-selection-container button {
  background-color: #64748b;
  color: #f8fafc;
}

.newspaper-selection-container button:hover {
  background-color: #94a3b8;
  color: #0f172a;
}

.newspaper-selection-container button.selected {
  background-color: var(--lightbox-button-bg);
  color: #ffffff;
}

#shamsiYear.year-out-of-archive,
  #shamsiMonth.year-out-of-archive,
  #shamsiDay.year-out-of-archive {
  color: #f87171 !important;
  border-color: #ef4444 !important;
}

.shamsi-date-out {
  color: #f87171 !important;
}
}

*, *::before, *::after {
  box-sizing: border-box;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid rgb(var(--highlight-color-r), var(--highlight-color-g), var(--highlight-color-b));
  outline-offset: 2px;
}

html {
  scroll-behavior: smooth;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-color) transparent;
}

*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

*::-webkit-scrollbar-thumb {
  background-color: var(--border-color);
  border-radius: 999px;
}

*::-webkit-scrollbar-thumb:hover {
  background-color: var(--text-secondary);
}

@keyframes fadeInUp {
from {
  opacity: 0;
  transform: translateY(10px);
}

to {
  opacity: 1;
  transform: translateY(0);
}
}

@keyframes popIn {
from {
  opacity: 0;
  transform: scale(0.96) translateY(8px);
}

to {
  opacity: 1;
  transform: scale(1) translateY(0);
}
}

body {
  font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 400;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0;
  padding: 16px 16px 40px;
  min-height: 100vh;
  background-color: var(--body-bg);
  background-image: radial-gradient(circle at 15% 0%, rgba(var(--highlight-color-r), var(--highlight-color-g), var(--highlight-color-b), 0.07), transparent 45%), radial-gradient(circle at 85% 8%, rgba(59, 130, 246, 0.05), transparent 40%);
  background-attachment: fixed;
  color: var(--text-color);
  transition: background-color 0.3s, color 0.3s;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.app-layout {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 24px;
  width: 100%;
  max-width: 1560px;
}

.sidebar-filters {
  width: 380px;
  flex-shrink: 0;
  position: sticky;
  top: 12px;
  max-height: calc(100vh - 24px);
  overflow-y: auto;
  overflow-x: visible;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-top: 4px;
  padding-bottom: 48px;
}

.sidebar-filters .controls {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  max-width: none;
  width: 100%;
  margin-bottom: 0;
  gap: 8px;
  padding: 12px;
}

.sidebar-filters .calendar-selection {
  width: auto;
  flex-shrink: 0;
  justify-content: center;
  display: flex;
  cursor: pointer;
}

.sidebar-filters .calendar-selection label {
  flex: 0 0 auto;
  text-align: center;
  padding: 6px 12px;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.calendar-selection input[type="radio"]#miladiCalendar:checked + label {
  background-color: #0369a1;
}

.sidebar-filters #shamsiDateControls,
.sidebar-filters #hijriDateControls,
.sidebar-filters #miladiiDateControls  {
  flex: 1;
  min-width: 0;
}

.calendar-switcher {
  display: flex;
  gap: 4px;
  padding: 3px;
  background: var(--body-bg);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.cal-switch-btn {
  padding: 5px 12px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  transition: all var(--transition);
  opacity: 0.4;
}

.cal-switch-btn.active {
  background: var(--button-bg);
  color: white;
  font-weight: 700;
  box-shadow: 0 0 0 2px var(--body-bg), 0 0 0 4px var(--button-bg);
  transform: scale(1.04);
  opacity: 1;
}

.cal-switch-btn[data-target="shamsi"].active {
  background: var(--lightbox-button-bg);
  box-shadow: 0 0 0 2px var(--body-bg), 0 0 0 4px var(--lightbox-button-bg);
}

.cal-switch-btn[data-target="miladi"].active {
  background: #0369a1;
  box-shadow: 0 0 0 2px var(--body-bg), 0 0 0 4px #0369a1;
}

.cal-switch-btn:hover:not(.active) {
  background: var(--border-subtle);
  opacity: 0.7;
}

.sidebar-filters #shamsiDateControls,
.sidebar-filters #hijriDateControls,
.sidebar-filters #miladiDateControls {
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 6px;
  align-items: center;
  justify-content: space-between;
  width: auto;
  flex: 1 1 auto;
  min-width: 0;
}

.sidebar-filters #shamsiDateControls label,
.sidebar-filters #hijriDateControls label,
.sidebar-filters #miladiDateControls label,
.calendar-selection input[type="radio"],
.newspaper-logo.hidden,
.lightbox-logo.hidden {
  display: none;
}

.sidebar-filters #shamsiDateControls select,
.sidebar-filters #hijriDateControls select,
.sidebar-filters #miladiDateControls select {
  padding: 7px 6px;
  font-size: 0.85rem;
  width: max-content;
  field-sizing: content;
  max-width: 100%;
  flex: 0 0 auto;
}

.sidebar-filters #shamsiDay,
.sidebar-filters #hijriDay,
.sidebar-filters #miladiDay,
.sidebar-filters #shamsiMonth,
.sidebar-filters #hijriMonth,
.sidebar-filters #miladiMonth,
.sidebar-filters #shamsiYear,
.sidebar-filters #hijriYear,
.sidebar-filters #miladiYear {
  flex: 0 0 auto;
  width: max-content;
  field-sizing: content;
  min-width: 0;
}

.sidebar-filters .controls-action-row {
  display: flex;
  flex-direction: row;
  gap: 8px;
  width: 100%;
}

.sidebar-filters .global-all-issues-btn {
  flex: 1;
  width: auto;
  margin: 0;
  text-align: center;
  padding: 9px 10px;
  font-size: 0.82rem;
  white-space: nowrap;
}

.sidebar-filters .newspapers-list-wrapper {
  width: 100%;
  max-width: none;
}

.sidebar-filters .global-issue-nav-controls {
  max-width: none;
  width: 100%;
  margin-bottom: 0;
  justify-content: flex-start;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 6px;
}

.sidebar-filters .global-issue-nav-controls h3 {
  width: 100%;
  margin-top: 10px;
  margin-bottom: 4px;
  font-size: 0.85rem;
}

.sidebar-filters .global-issue-nav-controls button {
  width: auto;
  flex: 0 1 auto;
  text-align: center;
  padding: 5px 9px;
  font-size: 0.75rem;
  border-radius: var(--radius-sm);
  line-height: 1.3;
}

.sidebar-filters .preview-page-controls {
  margin-top: 0;
  width: 100%;
  justify-content: center;
  flex-wrap: wrap;
}

.main-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.main-content .newspaper-container {
  max-width: none;
  width: 100%;
}

@media (max-width: 960px) {
.app-layout {
  flex-direction: column;
  max-width: 100%;
}

.sidebar-filters {
  width: 100%;
  position: static;
  max-height: none;
  overflow: visible;
}

.sidebar-filters .controls {
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}

.sidebar-filters .global-issue-nav-controls {
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
}

.sidebar-filters .global-issue-nav-controls button,
.sidebar-filters .global-all-issues-btn {
  width: auto;
}
}

.controls {
  margin-bottom: 20px;
  background-color: var(--control-bg);
  padding: 20px 24px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border-color);
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  max-width: 960px;
  width: 100%;
}

.controls label {
  margin-left: 6px;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.controls select,
.controls input[type="number"] {
  padding: 9px 12px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  background-color: var(--body-bg);
  color: var(--text-color);
  font-family: inherit;
  transition: border-color var(--transition), box-shadow var(--transition);
  min-width: 70px;
}

.controls select:focus,
.controls input[type="number"]:focus,
.newspaper-search-box input[type="search"]:focus {
  outline: none;
  border-color: var(--button-bg);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.18);
}

.calendar-selection {
  display: flex;
  gap: 0;
  justify-content: stretch;
  align-items: stretch;
  background: var(--body-bg);
  padding: 3px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  cursor: pointer;
}

.calendar-selection label {
  cursor: pointer;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  font-weight: 500;
  font-size: 0.85rem;
  transition: all var(--transition);
  margin: 0 !important;
  color: var(--text-secondary);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.calendar-selection input[type="radio"]:checked + label {
  color: white;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

.calendar-selection input[type="radio"]#shamsiCalendar:checked + label,
.global-issue-nav-controls button.shamsi-nav-btn {
  background-color: var(--lightbox-button-bg);
}

.calendar-selection input[type="radio"]#hijriCalendar:checked + label,
.global-issue-nav-controls button.hijri-nav-btn {
  background-color: var(--button-bg);
}

.global-issue-nav-controls {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 1100px;
  width: 100%;
}

.global-issue-nav-controls h3 {
  width: 100%;
  text-align: center;
  margin: 16px 0 8px;
  color: var(--section-title-color);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.global-issue-nav-controls button {
  padding: 9px 16px;
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 500;
  font-family: inherit;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}

.global-issue-nav-controls button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.global-issue-nav-controls button.shamsi-nav-btn:hover:not(:disabled) {
  background-color: var(--lightbox-button-hover-bg);
}

.global-issue-nav-controls button.hijri-nav-btn:hover:not(:disabled),
.issue-navigation-controls button:hover:not(:disabled),
.calendar-nav button:hover:not(:disabled) {
  background-color: var(--button-hover-bg);
}

.global-issue-nav-controls button.available-on-date {
  box-shadow: 0 0 0 2px var(--body-bg), 0 0 0 4px currentColor;
}

.global-issue-nav-controls button:disabled {
  background-color: var(--button-disabled-bg);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
  opacity: 0.6;
}

.global-all-issues-btn {
  margin-right: 0;
  padding: 10px 18px;
  background-color: var(--lightbox-button-bg);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  font-family: inherit;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}

.global-all-issues-btn:hover,
.open-calendar-from-error-btn:hover {
  background-color: var(--lightbox-button-hover-bg);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.newspaper-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  width: 100%;
  max-width: 1200px;
}

.newspaper-section {
  flex: 1;
  min-width: 300px;
  max-width: 360px;
  text-align: center;
  background-color: var(--section-bg);
  padding: 20px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform var(--transition), box-shadow var(--transition);
  animation: fadeInUp 0.45s ease both;
}

.newspaper-section:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}

.newspaper-section.no-image {
  min-width: 200px;
  max-width: 260px;
}

.newspaper-section h2 {
  margin: 0 0 14px;
  color: var(--section-title-color);
  font-weight: 400;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
}

.newspaper-section.available-newspaper h2 {
  font-weight: 700;
}

a.newspaper-title-link,
a.lightbox-title-link {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--transition), color var(--transition);
}

a.newspaper-title-link:hover,
a.lightbox-title-link:hover {
  color: var(--button-bg);
  border-bottom-color: rgba(var(--highlight-color-r), var(--highlight-color-g), var(--highlight-color-b), 0.45);
}

a.newspaper-title-link:focus-visible,
a.lightbox-title-link:focus-visible {
  outline: 2px solid var(--button-bg);
  outline-offset: 2px;
  border-radius: 2px;
}

.open-calendar-from-error-btn {
  display: inline-block;
  margin-top: 12px;
  padding: 9px 18px;
  background-color: var(--lightbox-button-bg);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  font-family: inherit;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}

.calendar-nav {
  flex-wrap: wrap;
  row-gap: 10px;
  justify-content: center;
  align-items: center;
}

.calendar-nav .calendar-switcher {
  flex-shrink: 0;
}

.image-container {
  max-width: 100%;
  height: auto;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  cursor: pointer;
  margin: 0 auto;
  display: block;
  position: relative;
  overflow: hidden;
  background: var(--body-bg);
  transition: box-shadow var(--transition);
}

.image-container:hover {
  box-shadow: var(--shadow-md);
}

.newspaper-image {
  max-width: 100%;
  height: auto;
  border-radius: var(--radius-md);
  display: block;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.image-container:hover .newspaper-image {
  transform: scale(1.02);
}

.image-placeholder {
  width: 100%;
  min-height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, var(--border-subtle), var(--body-bg));
  color: var(--text-secondary);
  border-radius: var(--radius-md);
  padding: 16px;
  box-sizing: border-box;
  text-align: center;
  font-size: 0.95rem;
}

.newspaper-section.no-image .image-placeholder {
  min-height: 280px;
}

.utlib-download-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 280px;
  background: linear-gradient(135deg, var(--lightbox-button-bg), #1e40af);

  border-radius: var(--radius-md);
  text-decoration: none;
  font-size: 1.15rem;
  font-weight: 600;
  padding: 20px;

  transition: opacity var(--transition), transform var(--transition);
}

.utlib-download-link:hover {
  opacity: 0.92;
  transform: scale(1.01);
}

.utlib-download-text {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  color: var(--text-color);
  padding: 16px;
  box-sizing: border-box;
  font-size: 1.1rem;
  font-weight: 600;
}

.error-message {
  color: var(--error-color);
  margin-top: 12px;
  text-align: center;
  width: 100%;
  font-size: 0.9rem;
  font-weight: 500;
}

#mainErrorWrap {
  display: none;
  text-align: center;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  align-self: center;
}

#mainErrorWrap .open-calendar-from-error-btn {
  display: none;
  margin: 12px auto 0;
}

.status-message {
  color: var(--status-color);
  margin-top: 12px;
  text-align: center;
  width: 100%;
  font-size: 0.9rem;
}

.preview-page-controls {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  width: 100%;
}

.preview-page-controls label {
  font-weight: 500;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.preview-page-controls input[type="number"] {
  width: 64px;
  text-align: center;
  background-color: var(--body-bg);

				const startYear = 1264;
				const yearIndex = year - startYear;

				if (yearIndex >= 0 && yearIndex < hijriMonths.length && month >= 1 && month <= 12) {
					const yearData = hijriMonths[yearIndex];
					const bitShift = 12 - month;
					const is30Days = (yearData >> bitShift) & 1;
					return is30Days ? 30 : 29;
				}

				const isLeapYear = (((11 * year) + 14) % 30) < 11;
				if (month % 2 === 1) return 30;
				if (month === 12 && isLeapYear) return 30;
				return 29;
			}

			function hijriToJdn(year, month, day) {
				let jdn = ANCHOR_JDN;
				if (year >= ANCHOR_HIJRI_YEAR) {
					for (let y = ANCHOR_HIJRI_YEAR; y < year; y++) {
						for (let m = 1; m <= 12; m++) jdn += getDaysInHijriMonth(y, m);
					}
					for (let m = 1; m < month; m++) jdn += getDaysInHijriMonth(year, m);
					jdn += (day - 1);
				} else {
					for (let y = ANCHOR_HIJRI_YEAR - 1; y >= year; y--) {
						for (let m = 12; m >= 1; m--) jdn -= getDaysInHijriMonth(y, m);
					}
					for (let m = 1; m < month; m++) jdn += getDaysInHijriMonth(year, m);
					jdn += (day - 1);
				}
				return jdn;
			}

			function jdnToHijri(jdn) {
				let currentJdn = ANCHOR_JDN;
				let y = ANCHOR_HIJRI_YEAR;
				if (jdn >= ANCHOR_JDN) {
					while (true) {
						let daysInYear = 0;
						for (let m = 1; m <= 12; m++) daysInYear += getDaysInHijriMonth(y, m);
						if (currentJdn + daysInYear > jdn) break;
						currentJdn += daysInYear;
						y++;
					}
					let m = 1;
					while (true) {
						let daysInMonth = getDaysInHijriMonth(y, m);
						if (currentJdn + daysInMonth > jdn) break;
						currentJdn += daysInMonth;
						m++;
					}
					return { year: y, month: m, day: jdn - currentJdn + 1 };
				} else {
					while (true) {
						y--;
						let daysInYear = 0;
						for (let m = 1; m <= 12; m++) daysInYear += getDaysInHijriMonth(y, m);
						if (currentJdn - daysInYear <= jdn) {
							currentJdn -= daysInYear;
							break;
						}
						currentJdn -= daysInYear;
					}
					let m = 1;
					while (true) {
						let daysInMonth = getDaysInHijriMonth(y, m);
						if (currentJdn + daysInMonth > jdn) break;
						currentJdn += daysInMonth;
						m++;
					}
					return { year: y, month: m, day: jdn - currentJdn + 1 };
				}
			}

			const gregorianToShamsi = (gy, gm, gd) => {
				const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
				let gy2 = (gm > 2) ? (gy + 1) : gy;
				let days = 355666 + (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
				let jy = -1595 + (33 * Math.floor(days / 12053));
				days %= 12053;
				jy += 4 * Math.floor(days / 1461);
				days %= 1461;
				if (days > 365) {
					jy += Math.floor((days - 1) / 365);
					days = (days - 1) % 365;
				}
				let jm, jd;
				if (days < 186) {
					jm = 1 + Math.floor(days / 31);
					jd = 1 + (days % 31);
				} else {
					jm = 7 + Math.floor((days - 186) / 30);
					jd = 1 + ((days - 186) % 30);
				}
				return { year: jy, month: jm, day: jd };
			};

				const filenameForHash = fullFileNameWithPdf.replace(/ /g, '_');

					const fullFileNameWithPdf = `${baseFileName}.pdf`;

					return `https://upload.wikimedia.org/wikipedia/commons/thumb/${hash[0]}/${hash}/${fileNameForUrlPath}/page${page}-${width}px-${fileNameForUrlPath}.jpg`;

			const getViewportScrollRatio = (vp) => {

				const maxX = Math.max(1, vp.scrollWidth - vp.clientWidth);
				const maxY = Math.max(1, vp.scrollHeight - vp.clientHeight);
				return {
					rx: vp.scrollLeft / maxX,
					ry: vp.scrollTop / maxY,
				};
			};

				if (!vp || !ratio) return;
				const maxX = Math.max(0, vp.scrollWidth - vp.clientWidth);

				const id = currentLightboxNewspaperId;

				const ratio = getViewportScrollRatio(vp);
				const pre = new Image();

						requestAnimationFrame(() => {

					lightboxImage.onload = onDone;
					lightboxImage.onerror = () => { lightboxHiResLoading = false; };
					lightboxImage.src = hiUrl;

			const captureLightboxBaseSize = () => {
				if (!lightboxImage || !lightboxImage.naturalWidth) return;
				const prevZoom = lightboxZoom;
				const prevW = lightboxImage.style.width;
				const prevH = lightboxImage.style.height;
				const prevMaxW = lightboxImage.style.maxWidth;
				const prevMaxH = lightboxImage.style.maxHeight;

				lightboxImage.style.width = '';
				lightboxImage.style.height = '';
				lightboxImage.style.maxWidth = '100%';
				lightboxImage.style.maxHeight = isLightboxDesktop() ? 'calc(96vh - 48px)' : 'calc(90vh - 220px)';
				const r = lightboxImage.getBoundingClientRect();
				lightboxBaseSize = { w: r.width || lightboxImage.clientWidth, h: r.height || lightboxImage.clientHeight };

				if (prevZoom > 1 && prevW) {
					lightboxImage.style.width = prevW;
					lightboxImage.style.height = prevH;

					lightboxImage.style.maxHeight = prevMaxH;

			};

				if (!lightboxImage || !lightboxBaseSize.w) return;
				const vp = document.getElementById('lightboxZoomViewport');
				const w = lightboxBaseSize.w * lightboxZoom;
				const h = lightboxBaseSize.h * lightboxZoom;
				lightboxImage.style.maxWidth = 'none';
				lightboxImage.style.maxHeight = 'none';
				lightboxImage.style.width = w + 'px';
				lightboxImage.style.height = h + 'px';
				lightboxImage.style.transform = 'none';

				if (vp) {
					vp.classList.toggle('is-zoomed', lightboxZoom > 1);

			};

				lightboxPanState = null;

					vp.scrollTop = 0;
					vp.classList.remove('is-panning');
					vp.classList.remove('is-zoomed');

				if (lightboxImage) {
					if (lightboxBaseSize.w) applyLightboxImageSize();

			const applyLightboxZoom = (delta, clientX, clientY) => {
				const vp = document.getElementById('lightboxZoomViewport');

				const my = (clientY != null) ? (clientY - rect.top) : rect.height / 2;

				const contentY = (vp.scrollTop + my) / prev;

				applyLightboxImageSize();

								const ie0 = IranianIslamicDateConverter.toJdn(yNum, mNum, lastDay);
								jdnStart = is0 >= 0 ? is0 - ISLAMIC_JDN_OFFSET : (typeof hijriToJdn === 'function' ? hijriToJdn(yNum, mNum, 1) : -1);
								jdnEnd = ie0 >= 0 ? ie0 - ISLAMIC_JDN_OFFSET : (typeof hijriToJdn === 'function' ? hijriToJdn(yNum, mNum, lastDay) : -1);

					lightboxWeekday.style.display = 'none';

					lightboxStatusMessage.textContent = 'در حال بارگذاری...';

						const onErr = () => {

							lightboxImage.onerror = null;
							resolve(false);

						lightboxImage.onload = onOk;
						lightboxImage.onerror = onErr;

						} else {

					const upgradeToMidRes = () => {

								requestAnimationFrame(() => {

							lightboxImage.onload = () => {

								lightboxImage.style.opacity = '1';

							lightboxImage.src = imageUrl;

						pre.src = imageUrl;

						// Use already-loaded card thumbnail as instant initial image when opening from card

						if (preferThumb && paper.hasImage && paper.sectionElement) {

							} else {

				const currentIndex = availableNewspapers.indexOf(currentLightboxNewspaperId);

					}
				}

				currentLightboxNewspaperId = newspaperId;
				lightboxCurrentPage = 1;

				mainPageNumberInput.value = 1;
				Object.values(newspaperData).forEach(p => { if(p) p.currentPage = 1; });

				loadImage('date');
				updateIssueNavButtons(newspaperId);

				if (lightboxOverlay.classList.contains('visible') && currentLightboxNewspaperId === newspaperId) {
					updateLightboxContent();
				}

				if (issueDateParsed) {
					updateUrlParameters(
						currentCalendarMode,
						currentCalendarMode === 'shamsi' ? shamsiYearInput.value : hijriYearInput.value,
						currentCalendarMode === 'shamsi' ? shamsiMonthSelect.value : hijriMonthSelect.value,
						currentCalendarMode === 'shamsi' ? shamsiDayInput.value : hijriDayInput.value
					);
				}
			};

			const goToPrevNewspaperIssue = (newspaperId) => {
				const paper = newspaperData[newspaperId];
				if (!paper || !paper.navState) return;
				const { currentIndex } = paper.navState;
				if (currentIndex > 0) goToNewspaperIssue(newspaperId, currentIndex - 1);
			};

			const goToNextNewspaperIssue = (newspaperId) => {
				const paper = newspaperData[newspaperId];
				if (!paper || !paper.navState) return;
				const { currentIndex, issuesArray } = paper.navState;
				if (currentIndex < issuesArray.length - 1) goToNewspaperIssue(newspaperId, currentIndex + 1);
			};

			const goToNewspaperIssueByNumber = (newspaperId) => {
				const paper = newspaperData[newspaperId];
				if (!paper || !paper.navState) return;
				const { issueNumberInput, issuesArray } = paper.navState;
				if (!issueNumberInput) return;

				const issueNumberText = persianToEnglishDigits(issueNumberInput.value);
				const issueNumber = parseInt(issueNumberText);
				if (isNaN(issueNumber)) return;
				const issueIndex = issuesArray.findIndex(issue => issue.number == issueNumber);
				if (issueIndex >= 0) goToNewspaperIssue(newspaperId, issueIndex);
			};

			const updateIssueNavigationVisibility = (newspaperId) => {
				const paper = newspaperData[newspaperId];
				if (!paper || paper.type !== 'database' || !paper.available || !paper.navState || !paper.navState.navigationDiv ||
					!paper.issues || paper.issues.length === 0 || paper.source === 'utlib') {
					if (paper && paper.navState && paper.navState.navigationDiv) {
						paper.navState.navigationDiv.style.display = 'none';
					}
					return;
				}

				const { navigationDiv, issueNumberInput, issuesArray } = paper.navState;
				navigationDiv.style.display = 'block';

				let currentYear, currentMonth, currentDay;
				if (currentCalendarMode === 'shamsi') {
					currentYear = parseInt(shamsiYearInput.value);
					currentMonth = parseInt(shamsiMonthSelect.value);
					currentDay = parseInt(shamsiDayInput.value);
				} else {
					currentYear = parseInt(hijriYearInput.value);
					currentMonth = parseInt(hijriMonthSelect.value);
					currentDay = parseInt(hijriDayInput.value);
				}

				let foundIndex = -1;
				const selectedDateString = `${currentYear}${pad(currentMonth)}${pad(currentDay)}`;

				if (paper.calendar_type === 'hijri') {
					if (paper.frequency === 'daily') {
						foundIndex = issuesArray.findIndex(issue => issue.date === selectedDateString);
					} else if (paper.frequency === 'monthly') {
						foundIndex = issuesArray.findIndex(issue => issue.date.substring(0, 6) === selectedDateString.substring(0, 6));
					}
				} else if (paper.calendar_type === 'shamsi') {
					if (paper.frequency === 'daily') {
						foundIndex = issuesArray.findIndex(issue => issue.date === selectedDateString);
					} else if (paper.frequency === 'monthly') {
						foundIndex = issuesArray.findIndex(issue => issue.date.substring(0, 6) === selectedDateString.substring(0, 6));
					}
				}

				paper.navState.currentIndex = foundIndex;
				paper.navState.currentIssue = foundIndex >= 0 ? issuesArray[foundIndex] : null;

				if (issueNumberInput) {
					if (foundIndex >= 0 && issuesArray[foundIndex]) {
						issueNumberInput.value = englishToPersianDigits(issuesArray[foundIndex].number) || '';
					} else {
						issueNumberInput.value = '';
					}
				}
				updateIssueNavButtons(newspaperId);
			};

			const handleGlobalGoToFirstIssue = (paperId) => {
				const paper = newspaperData[paperId];
				if (!paper) {
					console.warn(`Cannot go to first issue for ${paperId}: Newspaper data not found.`);
					return;
				}

				let targetDate = null;
				if (paper.type === 'database' && paper.issues && paper.issues.length > 0) {
					const issuesToConsider = paper.navState && paper.navState.issuesArray
											? paper.navState.issuesArray
											: [...paper.issues].sort((a,b) => {
												const dateA = parseInt(a.date, 10);
												const dateB = parseInt(b.date, 10);
												return dateA - dateB;
											});
					const firstChronologicalIssue = issuesToConsider[0];
					if (firstChronologicalIssue) {
						const parsed = parseDateString(firstChronologicalIssue.date);
						if (parsed) {
							targetDate = {
								year: parsed.year,
								month: parsed.month,
								day: parsed.day,
								calendar_type: paper.calendar_type
							};
						}
					}
				} else if (paper.type === 'formula' && paper.firstIssueDate) {
					const dateStr = paper.firstIssueDate;
					targetDate = {
						year: parseInt(dateStr.substring(0, 4)),
						month: parseInt(dateStr.substring(4, 6)),
						day: parseInt(dateStr.substring(6, 8)),
						calendar_type: paper.calendar_type
					};
				}

				if (targetDate) {
					if (targetDate.calendar_type === 'shamsi' && currentCalendarMode !== 'shamsi') {
						shamsiCalendarRadio.checked = true;
						currentCalendarMode = 'shamsi';
					} else if (targetDate.calendar_type === 'hijri' && currentCalendarMode !== 'hijri') {
						hijriCalendarRadio.checked = true;
						currentCalendarMode = 'hijri';
					}
					handleCalendarChange(targetDate);

					updateUrlParameters(
						currentCalendarMode,
						currentCalendarMode === 'shamsi' ? shamsiYearInput.value : hijriYearInput.value,
						currentCalendarMode === 'shamsi' ? shamsiMonthSelect.value : hijriMonthSelect.value,
						currentCalendarMode === 'shamsi' ? shamsiDayInput.value : hijriDayInput.value
					);
				} else {
					console.warn(`No first issue date defined or available for ${paperId}.`);
				}
			};

			const updateGlobalGoToFirstIssueButtonsVisibility = () => {
				let anyAvailable = false;
				Object.values(newspaperData).forEach(paper => {
					if (paper.globalFirstIssueBtn) {
						const isPermanentlyAvailable = (paper.type === 'database' && paper.issues && paper.issues.length > 0) ||
														(paper.type === 'formula' && paper.firstIssueDate);

						if (isPermanentlyAvailable) {
							paper.globalFirstIssueBtn.style.display = 'inline-block';
							if (paper.available) {
								paper.globalFirstIssueBtn.classList.add('available-on-date');
								anyAvailable = true;
							} else {
								paper.globalFirstIssueBtn.classList.remove('available-on-date');
							}
						} else {
							paper.globalFirstIssueBtn.style.display = 'none';
							paper.globalFirstIssueBtn.classList.remove('available-on-date');
						}
					}
				});
				if (globalGoToFirstIssueControls) {
					globalGoToFirstIssueControls.classList.toggle('has-available-on-date', anyAvailable);
				}
			};

			const openAllNewspapersIssuesModal = (initialPaperId = null) => {
				allIssuesModalErrorMessage.style.display = 'none';
				allIssuesModalNewspaperTitle.textContent = 'فهرست شماره‌های نشریات';
				newspaperSelectionContainer.innerHTML = '';
				issuesListContainer.innerHTML = '';
				issuesImageGridContainer.innerHTML = '';

				const dbPapersWithIssues = Object.values(newspaperData).filter(paper =>
					paper.type === 'database' && paper.issues && paper.issues.length > 0
				).sort((a, b) => {
					if (a.calendar_type === 'hijri' && b.calendar_type === 'shamsi') return -1;
					if (a.calendar_type === 'shamsi' && b.calendar_type === 'hijri') return 1;

					if (a.calendar_type === 'shamsi' && b.calendar_type === 'shamsi') {
						const yearA = a.source === 'utlib' && a.navState.issuesArray.length > 0 ? a.navState.issuesArray[0].year_shamsi : parseInt(a.firstIssueDate.substring(0, 4), 10);
						const yearB = b.source === 'utlib' && b.navState.issuesArray.length > 0 ? b.navState.issuesArray[0].year_shamsi : parseInt(b.firstIssueDate.substring(0, 4), 10);
						if (yearA !== yearB) return yearA - yearB;
						return a.title.localeCompare(b.title, 'fa');
					}

					const dateA = parseInt(a.firstIssueDate, 10);
					const dateB = parseInt(b.firstIssueDate, 10);
					if (dateA !== dateB) return dateA - dateB;

					return a.title.localeCompare(b.title, 'fa');
				});

				if (dbPapersWithIssues.length === 0) {
					allIssuesModalErrorMessage.textContent = 'هیچ نشریه‌ای با فهرست شماره در دیتابیس یافت نشد.';
					allIssuesModalErrorMessage.style.display = 'block';
				} else {
					let paperToSelectId = initialPaperId;

					dbPapersWithIssues.forEach(paper => {
						const paperButton = document.createElement('button');
						let buttonText = paper.title;
						if (paper.source === 'utlib') {
							buttonText += ' *';
						}
						paperButton.textContent = buttonText;
						paperButton.dataset.paperId = paper.id;
						paperButton.addEventListener('click', () => {
							displayIssuesForSelectedNewspaper(paper.id);
							Array.from(newspaperSelectionContainer.children).forEach(btn => {
								btn.classList.remove('selected');
							});
							paperButton.classList.add('selected');
						});
						newspaperSelectionContainer.appendChild(paperButton);

						if (initialPaperId && paper.id === initialPaperId) {
							paperToSelectId = paper.id;
						}
					});

					if (paperToSelectId) {
						displayIssuesForSelectedNewspaper(paperToSelectId);
						const selectedButton = newspaperSelectionContainer.querySelector(`button[data-paper-id="${paperToSelectId}"]`);
						if (selectedButton) {
							selectedButton.classList.add('selected');
						}
					} else if (dbPapersWithIssues.length > 0) {
						const firstPaperId = dbPapersWithIssues[0].id;
						displayIssuesForSelectedNewspaper(firstPaperId);
						if (newspaperSelectionContainer.children[0]) {
							newspaperSelectionContainer.children[0].classList.add('selected');
						}
					}
				}
				if (newspaperSelectionContainer) {
					newspaperSelectionContainer.classList.remove('is-collapsed');
				}
				if (newspaperSelectionToggleBtn) {
					newspaperSelectionToggleBtn.setAttribute('aria-expanded', 'true');
					newspaperSelectionToggleBtn.textContent = 'جمع کردن ▲';
				}
				allIssuesModalOverlay.classList.add('visible');
			};

			const displayIssuesForSelectedNewspaper = (paperId) => {
				const paper = newspaperData[paperId];
				if (!paper || !paper.issues || paper.issues.length === 0) {
					issuesListContainer.innerHTML = '';
					issuesImageGridContainer.innerHTML = '';
					issuesListContainer.style.display = 'none';
					issuesImageGridContainer.style.display = 'none';
					allIssuesModalErrorMessage.textContent = 'اطلاعات شماره‌ها برای این نشریه موجود نیست.';
					allIssuesModalErrorMessage.style.display = 'block';
					allIssuesModalNewspaperTitle.textContent = 'فهرست شماره‌های نشریات';
					return;
				}

				allIssuesModalErrorMessage.style.display = 'none';
				issuesListContainer.innerHTML = '';
				issuesImageGridContainer.innerHTML = '';

				const issuesToDisplaySorted = [...paper.issues].sort((a,b) => {
					if (paper.source === 'utlib') {
						const yearA = a.year_hijri || a.year_shamsi;
						const yearB = b.year_hijri || b.year_shamsi;
						if (yearA !== yearB) return yearA - yearB;
						if (a.volume !== b.volume) return a.volume - b.volume;
						const numA = a.number === null ? -Infinity : a.number;
						const numB = b.number === null ? -Infinity : b.number;
						return numA - numB;
					} else {
						const dateA = parseInt(a.date, 10);
						const dateB = parseInt(b.date, 10);
						return dateA - dateB;
					}
				});

				let titleText = paper.title;
				if (paper.source === 'utlib') {
					titleText += ' *';
				}
				allIssuesModalNewspaperTitle.textContent = `${titleText} (${englishToPersianDigits(issuesToDisplaySorted.length)} شماره)`;

				const displayDates = showDatesCheckbox.checked;
				const displayImages = showImagesCheckbox.checked;

				const targetContainer = displayImages ? issuesImageGridContainer : issuesListContainer;
				targetContainer.style.display = displayImages ? 'grid' : 'flex';
				issuesListContainer.style.display = displayImages ? 'none' : 'flex';
				issuesImageGridContainer.style.display = displayImages ? 'grid' : 'none';

				const groupedByVolume = new Map();
				issuesToDisplaySorted.forEach(issue => {
					let volumeKey;
					if (paper.source === 'utlib' && issue.year_shamsi) {
						volumeKey = `سال ${englishToPersianDigits(issue.year_shamsi)}`;
					} else if (paper.source === 'utlib' && issue.year_hijri) {
						volumeKey = `سال ${englishToPersianDigits(issue.year_hijri)}`;
					} else if (issue.volume !== null) {
						volumeKey = `دورهٔ ${englishToPersianDigits(issue.volume)}`;
					} else {
						volumeKey = 'بدون دوره';
					}

					if (!groupedByVolume.has(volumeKey)) {
						groupedByVolume.set(volumeKey, []);
					}
					groupedByVolume.get(volumeKey).push(issue);
				});

				const sortedVolumeKeys = Array.from(groupedByVolume.keys()).sort((a, b) => {
					const numA = parseInt(persianToEnglishDigits(a.split(' ')[1]), 10) || Infinity;
					const numB = parseInt(persianToEnglishDigits(b.split(' ')[1]), 10) || Infinity;
					return numA - numB;
				});

				sortedVolumeKeys.forEach(volumeKey => {
					const volumeHeader = document.createElement('div');
					volumeHeader.classList.add('volume-header');
					volumeHeader.textContent = volumeKey;
					targetContainer.appendChild(volumeHeader);

					const currentVolumeIssues = groupedByVolume.get(volumeKey);
					currentVolumeIssues.forEach(issue => {
						let buttonText = '';
						const hasVolume = issue.volume !== null && issue.volume !== undefined;
						const hasNumber = issue.number !== null && issue.number !== undefined;

						if (hasVolume && hasNumber) {
							buttonText = `دورهٔ ${englishToPersianDigits(issue.volume)}، شمارهٔ ${englishToPersianDigits(issue.number)}`;
						} else if (hasVolume) {
							buttonText = `دورهٔ ${englishToPersianDigits(issue.volume)}`;
						} else if (hasNumber) {
							buttonText = `شمارهٔ ${englishToPersianDigits(issue.number)}`;
						} else {
							buttonText = `شمارهٔ نامشخص`;
						}

						const issueUrl = getIssueFileUrl(paper, issue);

						if (paper.source === 'utlib') {
							let displayYear = '';
							if (issue.year_hijri !== undefined) {
								displayYear = englishToPersianDigits(issue.year_hijri);
								buttonText = `${buttonText}, سال ${displayYear}`;
							} else if (issue.year_shamsi !== undefined) {
								displayYear = englishToPersianDigits(issue.year_shamsi);
								buttonText = `${buttonText}, سال ${displayYear}`;
							}
						} else {
							if (displayDates) {
								const issueDateParsed = parseDateString(issue.date);
								if (issueDateParsed) {
									let monthNamesArray = (paper.calendar_type === 'shamsi') ? shamsiMonthNames : hijriMonthNames;
									const monthName = monthNamesArray[issueDateParsed.month - 1];
									if (paper.frequency === 'monthly') {
										buttonText += `, ${monthName} ${englishToPersianDigits(issueDateParsed.year)}`;
									} else {

										let weekdayLabel = 'روز';
										try {
											if (paper.calendar_type === 'shamsi') {
												const wd = getShamsiWeekday(issueDateParsed.year, issueDateParsed.month, issueDateParsed.day);
												if (wd !== null && shamsiWeekdayFullNames[wd]) weekdayLabel = shamsiWeekdayFullNames[wd];
											} else {
												let jdn = -1;
												const islamicJdn = IranianIslamicDateConverter.toJdn(issueDateParsed.year, issueDateParsed.month, issueDateParsed.day);
												jdn = islamicJdn >= 0 ? islamicJdn - ISLAMIC_JDN_OFFSET : (typeof hijriToJdn === 'function' ? hijriToJdn(issueDateParsed.year, issueDateParsed.month, issueDateParsed.day) : -1);
												if (jdn > 0) weekdayLabel = getAbsoluteWeekday(jdn);
											}
										} catch (e) {}
										buttonText += `, ${weekdayLabel} ${englishToPersianDigits(issueDateParsed.day)} ${monthName} ${englishToPersianDigits(issueDateParsed.year)}`;
									}
								}
							}
						}

						if (displayImages && paper.source !== 'utlib') {
							const thumbnailItem = document.createElement('div');
							thumbnailItem.classList.add('issue-thumbnail-item');

							const link = document.createElement('a');
							link.href = 'javascript:void(0)';
							link.onclick = (e) => {
								e.preventDefault();
								goToIssueFromModal(paper.id, issue);
							};
							link.style.textDecoration = 'none';
							link.style.width = '100%';
							link.style.height = '100%';
							link.style.display = 'flex';
							link.style.flexDirection = 'column';
							link.style.alignItems = 'center';

							const thumbnailImage = document.createElement('img');
							thumbnailImage.classList.add('issue-thumbnail-image');
							const fullFileNameWithPdf = `${issue.filename_base}.pdf`;
							const hash = getWikimediaHash(paper, fullFileNameWithPdf);
							const fileNameForUrlPath = fullFileNameWithPdf.replace(/ /g, '_');
							thumbnailImage.src = `https://upload.wikimedia.org/wikipedia/commons/thumb/${hash[0]}/${hash}/${fileNameForUrlPath}/page1-120px-${fileNameForUrlPath}.jpg`;
							thumbnailImage.alt = `تصویر شماره ${englishToPersianDigits(issue.number)} ${paper.title}`;
							thumbnailImage.onerror = (e) => {
								const placeholder = document.createElement('div');
								placeholder.classList.add('newspaper-image-placeholder');
								placeholder.textContent = 'تصویر در دسترس نیست';
								e.target.replaceWith(placeholder);
							};

							const thumbnailText = document.createElement('span');
							thumbnailText.classList.add('issue-thumbnail-text');
							thumbnailText.textContent = buttonText;

							link.appendChild(thumbnailImage);
							link.appendChild(thumbnailText);
							thumbnailItem.appendChild(link);
							targetContainer.appendChild(thumbnailItem);
						} else {
							const issueButton = document.createElement('a');
							issueButton.textContent = buttonText;
							issueButton.classList.add('issue-item-button');
							if (paper.source === 'utlib') {
								issueButton.href = issueUrl;
								issueButton.target = '_blank';
							} else {
								issueButton.href = 'javascript:void(0)';
								issueButton.onclick = (e) => {
									e.preventDefault();
									goToIssueFromModal(paper.id, issue);
								};
							}
							issueButton.style.textDecoration = 'none';
							targetContainer.appendChild(issueButton);
						}
					});
				});
			};

			const closeAllIssuesModal = () => {
				allIssuesModalOverlay.classList.remove('visible');
			};

			const goToIssueFromModal = async (paperId, issue) => {
				const paper = newspaperData[paperId];
				if (!paper) return;

				if (paper.source === 'utlib') {
					window.open(getIssueFileUrl(paper, issue), '_blank');
					closeAllIssuesModal();
					return;
				}

				if (!issue.date) {
					console.error("Issue date is missing for non-utlib paper.");
					return;
				}

				const issueDateParsed = parseDateString(issue.date);
				if (!issueDateParsed) return;

				if (paper) {
					paper.currentIssue = issue;
					if (paper.navState) {

						paper.navState.currentIndex = paper.navState.issuesArray.findIndex(i => i.filename_base === issue.filename_base);
					}
				}

				if (newspaperData[paperId].calendar_type === 'shamsi') {
					if (currentCalendarMode !== 'shamsi') {
						shamsiCalendarRadio.checked = true;
						currentCalendarMode = 'shamsi';
					}
					shamsiYearInput.value = issueDateParsed.year;
					shamsiMonthSelect.value = issueDateParsed.month;
					shamsiDayInput.value = issueDateParsed.day;
				} else {
					if (currentCalendarMode !== 'hijri') {
						hijriCalendarRadio.checked = true;
						currentCalendarMode = 'hijri';
					}
					hijriYearInput.value = issueDateParsed.year;
					hijriMonthSelect.value = issueDateParsed.month;
					hijriDayInput.value = issueDateParsed.day;
				}

				updateUrlParameters(
					currentCalendarMode,
					currentCalendarMode === 'shamsi' ? shamsiYearInput.value : hijriYearInput.value,
					currentCalendarMode === 'shamsi' ? shamsiMonthSelect.value : hijriMonthSelect.value,
					currentCalendarMode === 'shamsi' ? shamsiDayInput.value : hijriDayInput.value
				);

				closeAllIssuesModal();
				await loadImage('date');
				openLightbox(paperId);
			};

			const populateCalendarYearDropdown = () => {

				if (calendarYearSelect && calendarYearSelect.options.length === 0) {
					for (let year = minCalendarYear; year <= maxCalendarYear; year++) {
						const option = new Option(englishToPersianDigits(year), year);
						calendarYearSelect.add(option);
					}
				}
			};

			const openCalendarModal = () => {
				if (currentCalendarMode === 'shamsi') {
					shamsiCalendarModalErrorMessage.style.display = 'none';
					shamsiCalendarModalOverlay.classList.add('visible');
					shamsiCalendarYearSelect.value = shamsiYearInput.value;
					renderShamsiCalendar(parseInt(shamsiYearInput.value, 10));
					document.querySelectorAll('.cal-switch-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.target === 'shamsi'));
				} else if (currentCalendarMode === 'miladi') {
					if (miladiCalendarModalErrorMessage) miladiCalendarModalErrorMessage.style.display = 'none';
					if (miladiCalendarModalOverlay) {
						miladiCalendarModalOverlay.classList.add('visible');
						if (miladiCalendarYearSelect) miladiCalendarYearSelect.value = miladiYearInput.value;
						renderMiladiCalendar(parseInt(miladiYearInput.value, 10));
					}
					document.querySelectorAll('.cal-switch-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.target === 'miladi'));
				} else {
					calendarModalErrorMessage.style.display = 'none';
					calendarModalOverlay.classList.add('visible');
					calendarYearSelect.value = hijriYearInput.value;
					renderCalendar(parseInt(hijriYearInput.value, 10));
					document.querySelectorAll('.cal-switch-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.target === 'hijri'));
				}
			};

			const closeCalendarModal = () => {
				calendarModalOverlay.classList.remove('visible');
				shamsiCalendarModalOverlay.classList.remove('visible');
				if (miladiCalendarModalOverlay) miladiCalendarModalOverlay.classList.remove('visible');
			};

			const renderCalendar = (year) => {
				currentCalendarYear = year;
				calendarYearSelect.value = year;
				calendarGridContainer.innerHTML = '';

				prevYearBtn.disabled = currentCalendarYear <= minCalendarYear;
				nextYearBtn.disabled = currentCalendarYear >= maxCalendarYear;

				calendarModalTitle.textContent = `تقویم قمری`;

				const selectedHijriYear = parseInt(hijriYearInput.value, 10);
				const selectedHijriMonth = parseInt(hijriMonthSelect.value, 10);
				const selectedHijriDay = parseInt(hijriDayInput.value, 10);

				for (let month = 1; month <= 12; month++) {

			});
			nextYearBtn.addEventListener('click', () => {
				if (currentCalendarYear < maxCalendarYear) {
					renderCalendar(currentCalendarYear + 1);
				}
			});
			calendarModalCloseButton.addEventListener('click', closeCalendarModal);
			calendarModalOverlay.addEventListener('click', (e) => {
				if (e.target === calendarModalOverlay) {
					closeCalendarModal();
				}
			});

			shamsiCalendarYearSelect.addEventListener('change', (event) => {
				renderShamsiCalendar(parseInt(event.target.value, 10));
			});
			shamsiPrevYearBtn.addEventListener('click', () => {
				const currentShamsiYear = parseInt(shamsiCalendarYearSelect.value, 10);
				if (currentShamsiYear > 1239) {
					renderShamsiCalendar(currentShamsiYear - 1);
				}
			});
			shamsiNextYearBtn.addEventListener('click', () => {
				const currentShamsiYear = parseInt(shamsiCalendarYearSelect.value, 10);
				if (currentShamsiYear < 1373) {
					renderShamsiCalendar(currentShamsiYear + 1);
				}
			});
			shamsiCalendarModalCloseButton.addEventListener('click', closeCalendarModal);
			shamsiCalendarModalOverlay.addEventListener('click', (e) => {
				if (e.target === shamsiCalendarModalOverlay) {
					closeCalendarModal();
				}
			});

			if (miladiCalendarYearSelect) {
				miladiCalendarYearSelect.addEventListener('change', (event) => {
					renderMiladiCalendar(parseInt(event.target.value, 10));
				});
			}
			if (miladiPrevYearBtn) {
				miladiPrevYearBtn.addEventListener('click', () => {
					const y = parseInt(miladiCalendarYearSelect.value, 10);
					if (y > minMiladiCalendarYear) renderMiladiCalendar(y - 1);
				});
			}
			if (miladiNextYearBtn) {
				miladiNextYearBtn.addEventListener('click', () => {
					const y = parseInt(miladiCalendarYearSelect.value, 10);
					if (y < maxMiladiCalendarYear) renderMiladiCalendar(y + 1);
				});
			}
			if (miladiCalendarModalCloseButton) {
				miladiCalendarModalCloseButton.addEventListener('click', closeCalendarModal);
			}
			if (miladiCalendarModalOverlay) {
				miladiCalendarModalOverlay.addEventListener('click', (e) => {
					if (e.target === miladiCalendarModalOverlay) closeCalendarModal();
				});
			}

			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && (calendarModalOverlay.classList.contains('visible') || shamsiCalendarModalOverlay.classList.contains('visible') || (miladiCalendarModalOverlay && miladiCalendarModalOverlay.classList.contains('visible')))) {
					closeCalendarModal();
				}
			});

			initializeApp();
		});
	</script>
</body>
</html>
